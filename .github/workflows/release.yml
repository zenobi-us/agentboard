name: Release

on:
  push:
    branches:
      - main
      - release/*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      publish_matrix: ${{ steps.publish-matrix.outputs.publish_matrix }}
      channel: ${{ steps.publish-matrix.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: SetupToolchain
        uses: moonrepo/setup-toolchain@8794f0318b9df4a43a5ddc23cefd16f595b423dd # v0
        with:
          auto-install: true
          auto-setup: true

      - name: RestoreMoonCache
        uses: ./.github/actions/moon-cache
        with:
          key-prefix: moon-release
          cache-version: v1

      - name: DetermineReleaseOwnership
        id: ownership
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/release/*:refs/remotes/origin/release/*' --quiet
          process=true
          reason="branch owns commit"

          if [[ "${GITHUB_REF_NAME}" == release/* ]]; then
            if .github/tasks/release-branches.sh is-root-commit "${GITHUB_SHA}" "${GITHUB_REF_NAME}" origin/main; then
              process=false
              reason="release branch root was already released from main"
            fi
          else
            hotfix_pr="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq 'any(.[]; .head.ref | startswith("release/"))')"

            if [[ "${hotfix_pr}" == "true" ]] || \
              .github/tasks/release-branches.sh is-hotfix-merge "${GITHUB_SHA}" '${{ github.event.before }}'; then
              process=false
              reason="commit is owned by a hotfix release branch"
            fi
          fi

          echo "process=${process}" >>"${GITHUB_OUTPUT}"
          echo "Release ownership: ${reason}" >>"${GITHUB_STEP_SUMMARY}"

      - name: PrepareReleasePleaseMode
        id: mode
        run: |
          set -euo pipefail
          mode="$(.github/tasks/get-release-mode "${GITHUB_REF_NAME}")"
          case "${mode}" in
            hotfix) config_file="release-please-config--hotfix.json" ;;
            normal) config_file="release-please-config--release.json" ;;
            *) echo "Unsupported release mode: ${mode}" >&2; exit 1 ;;
          esac
          echo "mode=${mode}" >>"${GITHUB_OUTPUT}"
          echo "config_file=${config_file}" >>"${GITHUB_OUTPUT}"

      - name: RunReleasePlease
        if: steps.ownership.outputs.process == 'true'
        id: release-please
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: ${{ steps.mode.outputs.config_file }}
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}
          skip-github-pull-request: false

      - name: SummaryReleasePleaseOutputs
        if: steps.ownership.outputs.process == 'true'
        env:
          RP_MODE: ${{ steps.mode.outputs.mode }}
          RP_CONFIG_FILE: ${{ steps.mode.outputs.config_file }}
        run: |
          cat <<'EOF' | ./.github/tasks/summarise-release-please.sh
          ${{ toJson(steps.release-please.outputs) }}
          EOF

      - name: GeneratePublishMatrix
        id: publish-matrix
        env:
          PROCESS_RELEASE: ${{ steps.ownership.outputs.process }}
          RELEASES_CREATED: ${{ steps.release-please.outputs.releases_created }}
          BASE_REF_INPUT: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "${PROCESS_RELEASE}" != "true" ]]; then
            echo 'publish_matrix=[]' >>"${GITHUB_OUTPUT}"
            echo 'channel=next' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          base_ref="${BASE_REF_INPUT}"
          if [[ -z "${base_ref}" || "${base_ref}" == "0000000000000000000000000000000000000000" ]] || \
            ! git cat-file -e "${base_ref}^{commit}" 2>/dev/null; then
            base_ref="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "${GITHUB_SHA}")"
          fi

          channel=next
          [[ "${RELEASES_CREATED,,}" == "true" ]] && channel=latest
          publish_matrix="$(.github/tasks/get-publish-matrix "${base_ref}" "${GITHUB_SHA}")"

          echo "publish_matrix=${publish_matrix}" >>"${GITHUB_OUTPUT}"
          echo "channel=${channel}" >>"${GITHUB_OUTPUT}"
          {
            echo '## Publish selection'
            echo "- channel: \`${channel}\`"
            echo "- source branch: \`${GITHUB_REF_NAME}\`"
            echo "- source SHA: \`${GITHUB_SHA}\`"
            jq -r '.[]? | "- target: `\(.target)`"' <<<"${publish_matrix}"
          } >>"${GITHUB_STEP_SUMMARY}"

  publish:
    needs: process
    if: needs.process.outputs.publish_matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.process.outputs.publish_matrix) }}
    steps:
      - name: DispatchPublish-${{ matrix.target }}-${{ needs.process.outputs.channel }}
        uses: peter-evans/repository-dispatch@bf47d102fdb849e755b0b0023ea3e81a44b6f570 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: publish-package
          client-payload: '{"target":"${{ matrix.target }}","channel":"${{ needs.process.outputs.channel }}","source_sha":"${{ github.sha }}","source_branch":"${{ github.ref_name }}"}'
