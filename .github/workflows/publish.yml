name: Publish
run-name: Publish ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.target || inputs.target }}-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.channel || inputs.channel }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Moon project ID to publish
        required: true
        type: string
      channel:
        description: Distribution channel
        required: true
        default: next
        type: choice
        options:
          - next
          - latest
  repository_dispatch:
    types: [publish-package]

permissions:
  id-token: write
  contents: write
  pages: write
  packages: write

concurrency:
  group: publish-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.target || inputs.target }}-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.channel || inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: publish-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.target || inputs.target }}
    env:
      PUBLISH_TARGET: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.target || inputs.target }}
      PUBLISH_CHANNEL: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.channel || inputs.channel }}
      PUBLISH_REF: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source_sha || github.sha }}
      PUBLISH_SOURCE_BRANCH: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source_branch || github.ref_name }}
      LEGACY_TAG: ${{ github.event.client_payload.tag }}
      LEGACY_PUBLISH_TAG: ${{ github.event.client_payload.publish_tag }}
      CALLER_VERSION: ${{ github.event.client_payload.version }}
      CALLER_RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
    steps:
      - name: ValidateSourceIdentity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for name in PUBLISH_TARGET PUBLISH_CHANNEL PUBLISH_REF PUBLISH_SOURCE_BRANCH; do
            [[ -n "${!name}" ]] || { echo "ERROR: ${name} is empty" >&2; exit 1; }
          done
          case "${PUBLISH_CHANNEL}" in
            next|latest) ;;
            *) echo "ERROR: PUBLISH_CHANNEL must be next or latest" >&2; exit 1 ;;
          esac
          case "${PUBLISH_SOURCE_BRANCH}" in
            main|release/*) ;;
            *) echo "ERROR: source branch must be main or release/*" >&2; exit 1 ;;
          esac
          [[ "${PUBLISH_REF}" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: source SHA must be a full commit SHA" >&2; exit 1; }

          if [[ "${GITHUB_EVENT_NAME}" == "repository_dispatch" ]]; then
            [[ "${GITHUB_ACTOR}" == "github-actions[bot]" ]] || {
              echo "ERROR: repository dispatch actor '${GITHUB_ACTOR}' is not trusted" >&2
              exit 1
            }
            [[ -z "${LEGACY_TAG}${LEGACY_PUBLISH_TAG}${CALLER_VERSION}${CALLER_RELEASE_TAG}" ]] || {
              echo "ERROR: caller-computed tag/version fields are forbidden" >&2
              exit 1
            }
          fi

          validation_repo="${RUNNER_TEMP}/publish-source-validation"
          rm -rf "${validation_repo}"
          git init --bare --quiet "${validation_repo}"
          git -C "${validation_repo}" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "${validation_repo}" fetch --quiet --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/*:refs/remotes/origin/release/*'

          branch_ref="refs/remotes/origin/${PUBLISH_SOURCE_BRANCH}"
          git -C "${validation_repo}" show-ref --verify --quiet "${branch_ref}" || {
            echo "ERROR: source branch '${PUBLISH_SOURCE_BRANCH}' does not exist" >&2
            exit 1
          }
          git -C "${validation_repo}" cat-file -e "${PUBLISH_REF}^{commit}" 2>/dev/null || {
            echo "ERROR: source SHA '${PUBLISH_REF}' does not exist" >&2
            exit 1
          }
          git -C "${validation_repo}" merge-base --is-ancestor "${PUBLISH_REF}" "${branch_ref}" || {
            echo "ERROR: source SHA is not reachable from '${PUBLISH_SOURCE_BRANCH}'" >&2
            exit 1
          }

      - name: CheckoutImmutableSource
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.PUBLISH_REF }}

      - name: SetupToolchain
        uses: moonrepo/setup-toolchain@8794f0318b9df4a43a5ddc23cefd16f595b423dd # v0
        with:
          auto-install: true
          auto-setup: true

      - name: InstallDependencies
        run: bun install --frozen-lockfile

      - name: RestoreMoonCache
        uses: ./.github/actions/moon-cache
        with:
          key-prefix: moon-publish
          cache-version: v1

      - name: ResolvePublishMetadata
        id: metadata
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          metadata="$(pkgs/tools/deployment/resolve-publish-metadata \
            "${PUBLISH_TARGET}" "${PUBLISH_CHANNEL}" "${PUBLISH_SOURCE_BRANCH}" "${RUN_ATTEMPT}")"
          jq -e '
            (.target | type == "string" and length > 0) and
            (.source | type == "string" and length > 0) and
            (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+(-next\\.[0-9]+\\.[0-9]+)?$")) and
            (.release_tag | type == "string" and length > 0)
          ' >/dev/null <<<"${metadata}"
          {
            echo "PUBLISH_VERSION=$(jq -r .version <<<"${metadata}")"
            echo "PUBLISH_RELEASE_TAG=$(jq -r .release_tag <<<"${metadata}")"
            echo "PUBLISH_PROJECT_SOURCE=$(jq -r .source <<<"${metadata}")"
          } >>"${GITHUB_ENV}"
          echo "metadata=${metadata}" >>"${GITHUB_OUTPUT}"

      - name: EnsureGitHubRelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${PUBLISH_CHANNEL}" == "latest" ]]; then
            gh release view "${PUBLISH_RELEASE_TAG}" >/dev/null || {
              echo "ERROR: Release Please stable release '${PUBLISH_RELEASE_TAG}' does not exist" >&2
              exit 1
            }
          elif ! gh release view "${PUBLISH_RELEASE_TAG}" >/dev/null 2>&1; then
            if ! gh release create "${PUBLISH_RELEASE_TAG}" \
              --target "${PUBLISH_REF}" \
              --title "${PUBLISH_RELEASE_TAG}" \
              --prerelease \
              --generate-notes; then
              gh release view "${PUBLISH_RELEASE_TAG}" >/dev/null || exit 1
            fi
          fi

      - name: InstallAgentboardCrossCompiler
        if: env.PUBLISH_TARGET == 'agentboard'
        run: sudo apt-get update && sudo apt-get install --yes gcc-mingw-w64-x86-64

      - name: PublishTarget
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          DOCS_PUBLISH_SSH_KEY: ${{ secrets.DOCS_PUBLISH_SSH_KEY }}
          DOCS_PUBLISH_TOKEN: ${{ secrets.DOCS_PUBLISH_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: moon run "${PUBLISH_TARGET}:publish" --force

      - name: PublishSummary
        if: always()
        run: |
          {
            echo '## Publish Summary'
            echo '| Field | Value |'
            echo '|---|---|'
            echo "| target | \`${PUBLISH_TARGET}\` |"
            echo "| channel | \`${PUBLISH_CHANNEL}\` |"
            echo "| version | \`${PUBLISH_VERSION:-unresolved}\` |"
            echo "| release tag | \`${PUBLISH_RELEASE_TAG:-unresolved}\` |"
            echo "| source branch | \`${PUBLISH_SOURCE_BRANCH}\` |"
            echo "| source SHA | \`${PUBLISH_REF}\` |"
            echo "| trigger | \`${GITHUB_EVENT_NAME}\` |"
            echo "| result | \`${{ job.status }}\` |"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: MoonRunReportSummary
        if: always()
        continue-on-error: true
        uses: moonrepo/run-report-action@bfb317b1a2fd5b879d7c14d6d7af6360178fd879 # v1.9.0
        with:
          access-token: ${{ github.token }}
          skip-comment: "true"
