[[sources]]
id = "implement"

[sources.source]
uses = "@agentboard/source-github"
mode = "issue"
query = '''repo:zenobi-us/agentboard is:open (label:"ready-for-agent" OR label:"agentboard:changes-requested") -label:"agentboard:implementing" -label:"agentboard:ready-for-review" -label:"agentboard:reviewing" sort:created-asc'''
limit = 1

[sources.source.credentials]
helper = "gh auth token"

[sources.source.status_map]
"ready-for-agent" = "ready"
"agentboard:changes-requested" = "changes-requested"

[[sources.actions]]
uses = "@agentboard/action-run-cmd"

[sources.actions.with]
cwd = "."
cmd = '''
: "{{ item.raw.github.issue.updated_at }}";
./scripts/agentboard-herdr-run.sh implement "{{ item.reference_id }}" "{{ item.id | slugify }}"
'''

[[sources]]
id = "review"

[sources.source]
uses = "@agentboard/source-github"
mode = "issue"
query = '''repo:zenobi-us/agentboard is:open label:"agentboard:ready-for-review" -label:"agentboard:reviewing" sort:updated-asc'''
limit = 1

[sources.source.credentials]
helper = "gh auth token"

[sources.source.status_map]
"agentboard:ready-for-review" = "ready-for-review"
"agentboard:review-complete" = "review-complete"

[[sources.actions]]
uses = "@agentboard/action-run-cmd"

[sources.actions.with]
cwd = "."
cmd = '''
: "{{ item.raw.github.issue.updated_at }}";
./scripts/agentboard-herdr-run.sh review "{{ item.reference_id }}" "{{ item.id | slugify }}"
'''
