[[sources]]
id = "implement"

[sources.source]
uses = "@clankpipe/source-github"
mode = "issue"
query = '''repo:zenobi-us/clankpipe is:open (label:"ready-for-agent" OR label:"agentboard:changes-requested") -label:"agentboard:implementing" -label:"agentboard:ready-for-review" -label:"agentboard:reviewing" sort:created-asc'''
limit = 1

[sources.source.credentials]
helper = "gh auth token"

[sources.source.status_map]
"ready-for-agent" = "ready"
"agentboard:changes-requested" = "changes-requested"

[[sources.actions]]
id = "worktree"
uses = "@clankpipe/action-worktree"

[sources.actions.with]
repo = "."
root = "$PWD/../AgentBoard.worktrees/issue-{{ item.id | slugify }}"
branch = "agentboard/{{ item.id | slugify }}"

[[sources.actions]]
id = "run_llm"
uses = "@clankpipe/action-llm"

[sources.actions.with]
prompt = 'implement {{ item.reference_id }} (Source updated at: {{ item.raw.github.issue.updated_at }})'

[sources.actions.with.terminal]
kind = "herdr"
container = "worktree"
cwd = "{{ actions.worktree.inputs.root }}"
harness = "pi"
harness_args = ["--approve", "@.pi/prompts/implement.md"]

[[sources]]
id = "review"

[sources.source]
uses = "@clankpipe/source-github"
mode = "issue"
query = '''repo:zenobi-us/clankpipe is:open label:"agentboard:ready-for-review" -label:"agentboard:reviewing" sort:updated-asc'''
limit = 1

[sources.source.credentials]
helper = "gh auth token"

[sources.source.status_map]
"agentboard:ready-for-review" = "ready-for-review"
"agentboard:review-complete" = "review-complete"

[[sources.actions]]
id = "worktree"
uses = "@clankpipe/action-worktree"

[sources.actions.with]
repo = "."
root = "$PWD/../AgentBoard.worktrees/issue-{{ item.id | slugify }}"
branch = "agentboard/{{ item.id | slugify }}"

[[sources.actions]]
id = "run_llm"
uses = "@clankpipe/action-llm"

[sources.actions.with]
prompt = 'review {{ item.reference_id }} (Source updated at: {{ item.raw.github.issue.updated_at }})'

[sources.actions.with.terminal]
kind = "herdr"
container = "worktree"
cwd = "{{ actions.worktree.inputs.root }}"
harness = "pi"
harness_args = [ "--approve", "@.pi/prompts/review.md"]
