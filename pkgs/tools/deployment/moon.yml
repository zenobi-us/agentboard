# yaml-language-server: $schema=../../../.moon/cache/schemas/project.json
language: bash
layer: tool

project:
  name: deployment

tasks:
  test:
    script: |
      bash -n deploy-github-pages npm-publish resolve-publish-metadata
      bats npm-publish.bats resolve-publish-metadata.bats
    inputs:
      - "deploy-github-pages"
      - "npm-publish"
      - "npm-publish.bats"
      - "resolve-publish-metadata"
      - "resolve-publish-metadata.bats"
