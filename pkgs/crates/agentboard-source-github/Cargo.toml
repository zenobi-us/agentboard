[package]
name = "agentboard-source-github"
version = "0.0.1"
edition = "2021"
description = "AgentBoard GitHub source adapter"
license = "MIT"
repository = "https://github.com/zenobi-us/agentboard"

[dependencies]
agentboard-core = { path = "../agentboard-core" }
anyhow = "1"
command-group = { version = "5.0.1", features = ["with-tokio"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
schemars = { version = "0.8", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process"] }

[dev-dependencies]
toml = "0.8"
