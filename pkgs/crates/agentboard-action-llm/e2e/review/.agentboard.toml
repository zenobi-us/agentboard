[[sources]]
id = "local"

[sources.source]
uses = "@agentboard/source-qmd"
collections = ["tasks"]
query = "status: ready"
limit = 10

[[sources.actions]]
id = "worktree"
uses = "@agentboard/action-worktree"

[sources.actions.with]
repo = "$E2E_REPO"
root = "$E2E_REPO/worktree"
branch = "agentboard/test"

[[sources.actions]]
id = "run_llm"
uses = "@agentboard/action-llm"

[sources.actions.with]
prompt = "/review {{ item.reference_id }}"
cwd = "{{ actions.worktree.inputs.root }}"

[sources.actions.with.terminal]
kind = "generic"
command = "/usr/bin/env"
args = ["fake-llm"]
