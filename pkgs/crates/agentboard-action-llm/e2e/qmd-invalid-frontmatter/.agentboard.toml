[[sources]]
id = "local"

[sources.source]
uses = "@agentboard/source-qmd"
collections = ["tasks"]
query = "status: ready"
limit = 10

[[sources.actions]]
id = "run_llm"
uses = "@agentboard/action-llm"

[sources.actions.with]
prompt = "/implement {{ item.reference_id }}"

[sources.actions.with.terminal]
kind = "generic"
command = "/usr/bin/env"
args = ["fake-llm"]
