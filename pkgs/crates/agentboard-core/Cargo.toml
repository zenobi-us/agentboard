[package]
name = "agentboard-core"
version = "0.0.1"
edition = "2021"
description = "Shared AgentBoard data model"
license = "MIT"
repository = "https://github.com/zenobi-us/agentboard"

[dependencies]
anyhow = "1"
schemars = { version = "0.8", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
toml = "0.8"
