[package]
name = "agentboard-action-run-cmd"
version = "0.0.1"
edition = "2021"
description = "AgentBoard shell command action"
license = "MIT"
repository = "https://github.com/zenobi-us/agentboard"

[dependencies]
agentboard-core = { path = "../agentboard-core" }
anyhow = "1"
command-group = "5.0.1"
humantime = "2"
schemars = { version = "0.8", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
