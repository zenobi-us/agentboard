---
$schema: "file://../../../.moon/cache/schemas/project.json"

language: rust
layer: application

tasks:
  build:
    command: "cargo build"
    inputs:
      - "Cargo.toml"
      - "src/**/*.rs"
    outputs:
      - "target/debug/agentboard"

  check:
    command: "cargo check"
    inputs:
      - "Cargo.toml"
      - "src/**/*.rs"

  typecheck:
    deps:
      - "~:check"
    command: "noop"

  test:
    command: "cargo test"
    inputs:
      - "Cargo.toml"
      - "src/**/*.rs"

  bats:
    deps:
      - "~:build"
    command: "bats test/*.bats"
    inputs:
      - "Cargo.toml"
      - "src/**/*.rs"
      - "test/*.bats"

  lint:
    deps:
      - "~:check"
    command: "noop"

  publish:
    type: run
    deps:
      - "~:build"
    options:
      cache: false
      runInCI: true
    script: |
      set -euo pipefail
      echo "No publish target configured for agentboard yet."
