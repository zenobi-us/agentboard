[package]
name = "agentboard"
version = "0.0.1"
edition = "2021"
description = "CLI for collecting task tracking items into local agent work queues"
license = "MIT"
repository = "https://github.com/zenobi-us/agentboard"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
minijinja = "2.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
