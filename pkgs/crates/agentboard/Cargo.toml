[package]
name = "agentboard"
version = "0.0.1"
edition = "2021"
description = "CLI for collecting task tracking items into local agent work queues"
license = "MIT"
repository = "https://github.com/zenobi-us/agentboard"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
minijinja = "2.21"
schemars = { version = "0.8", features = ["preserve_order"] }
search-query-parser = "0.1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
