[package]
name = "agentboard-source-qmd"
version = "0.0.1"
edition = "2021"
description = "AgentBoard QMD source adapter"
license = "MIT"
repository = "https://github.com/zenobi-us/agentboard"

[dependencies]
agentboard-core = { path = "../agentboard-core" }
anyhow = "1"
schemars = { version = "0.8", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"

[dev-dependencies]
toml = "0.8"
