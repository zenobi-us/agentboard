[package]
name = "agentboard-source-jira"
version = "0.0.1"
edition = "2021"
description = "AgentBoard Jira source adapter"
license = "MIT"
repository = "https://github.com/zenobi-us/agentboard"

[dependencies]
agentboard-core = { path = "../agentboard-core" }
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
schemars = { version = "0.8", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
toml = "0.8"
