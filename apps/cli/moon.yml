---
$schema: "file://../../.moon/cache/schemas/project.json"
id: clankpipe
language: typescript
layer: application

tasks:
  dev:
    command: "bun --hot src/cli/index.ts"
    toolchains: ["javascript", "bun"]
    options:
      runInCI: false

  ts-typecheck:
    command: "tsc --noEmit"
    toolchains: ["javascript", "bun"]
    inputs:
      - "package.json"
      - "tsconfig.json"
      - "src/**/*.ts"
      - "src/**/*.tsx"

  ts-build:
    script: "bun build src/cli/index.ts --target bun --format esm --external minijinja-js --external @opentui/core --external @opentui/react --external @opentui/core-darwin-x64 --external @opentui/core-darwin-arm64 --external @opentui/core-linux-x64 --external @opentui/core-linux-arm64 --external @opentui/core-win32-x64 --external @opentui/core-win32-arm64 --external @opentui/core-linux-x64-musl --external @opentui/core-linux-arm64-musl --outfile dist/cli && bun build src/cli/agentboard.ts --target bun --format esm --external minijinja-js --external @opentui/core --external @opentui/react --external @opentui/core-darwin-x64 --external @opentui/core-darwin-arm64 --external @opentui/core-linux-x64 --external @opentui/core-linux-arm64 --external @opentui/core-win32-x64 --external @opentui/core-win32-arm64 --external @opentui/core-linux-x64-musl --external @opentui/core-linux-arm64-musl --outfile dist/agentboard"
    toolchains: ["javascript", "bun"]
    inputs:
      - "package.json"
      - "tsconfig.json"
      - "src/**/*.ts"
      - "src/**/*.tsx"
    outputs:
      - "dist/cli"
      - "dist/agentboard"

  build:
    deps:
      - "~:ts-build"
    command: "noop"

  check:
    deps:
      - "~:ts-typecheck"
    command: "noop"

  typecheck:
    deps:
      - "~:ts-typecheck"
    command: "noop"

  ts-test:
    command: "bun test ./src"
    toolchains: ["javascript", "bun"]
    inputs:
      - "package.json"
      - "tsconfig.json"
      - "src/**/*.ts"
      - "src/**/*.tsx"

  test:
    deps:
      - "~:ts-test"
    command: "noop"

  lint:
    deps:
      - "~:ts-typecheck"
    command: "noop"

  install:
    deps:
      - "~:ts-build"
    command: "noop"

  start:
    deps:
      - "~:ts-build"
    command: "./dist/cli"
    options:
      runInCI: false

  publish:
    command: "${MOON_WORKSPACE_ROOT}/pkgs/tools/deployment/npm-publish"
    deps:
      - "~:build"
    options:
      cache: false
      runInCI: true
