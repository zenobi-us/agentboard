---
$schema: "file://../../.moon/cache/schemas/project.json"
id: agentboard
language: typescript
layer: application

tasks:
  dev:
    command: "bun --hot src/cli/index.ts"
    toolchains: ["javascript", "bun"]
    options:
      runInCI: false

  ts-typecheck:
    command: "tsc --noEmit"
    toolchains: ["javascript", "bun"]
    inputs:
      - "package.json"
      - "tsconfig.json"
      - "src/**/*.ts"

  ts-build:
    command: "bun build src/cli/index.ts --target bun --format esm --external minijinja-js --outfile dist/cli"
    toolchains: ["javascript", "bun"]
    inputs:
      - "package.json"
      - "tsconfig.json"
      - "src/**/*.ts"
    outputs:
      - "dist/cli"

  build:
    deps:
      - "~:ts-build"
    command: "noop"

  check:
    deps:
      - "~:ts-typecheck"
    command: "noop"

  typecheck:
    deps:
      - "~:ts-typecheck"
    command: "noop"

  ts-test:
    command: "bun test ./src"
    toolchains: ["javascript", "bun"]
    inputs:
      - "package.json"
      - "tsconfig.json"
      - "src/**/*.ts"

  test:
    deps:
      - "~:ts-test"
    command: "noop"

  lint:
    deps:
      - "~:ts-typecheck"
    command: "noop"

  install:
    deps:
      - "~:ts-build"
    command: "noop"

  start:
    deps:
      - "~:ts-build"
    command: "./dist/cli"
    options:
      runInCI: false

  publish:
    command: "${MOON_WORKSPACE_ROOT}/pkgs/tools/deployment/npm-publish"
    deps:
      - "~:build"
    options:
      cache: false
      runInCI: true
