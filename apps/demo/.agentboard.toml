[[sources]]
id = "implement"

[sources.source]
kind = "github"
mode = "issue"
query = '''repo:__GITHUB_REPOSITORY__ is:open label:"agentboard:ready-for-agent" -label:"agentboard:ready-for-review" -label:"agentboard:in-progress"'''
limit = 12

[sources.source.credentials]
helper = "gh auth token"

[sources.source.status_map]
"agentboard:ready-for-agent" = "ready-for-agent"
"agentboard:changes-requested" = "changes-requested"

[[sources.actions]]
id = "worktree"
uses = "agentboard/create-worktree"

[sources.actions.with]
repo = "."
root = "worktrees/issue-{{ item.reference_id }}"
branch = "agentboard/issue-{{ item.reference_id }}"

[[sources.actions]]
uses = "agentboard/run-cmd"

[sources.actions.with]
# ponytail: updated_at rearms this demo after label transitions; production workflows need explicit retry generations.
cmd = ''': "{{ item.raw.github.issue.updated_at }}"; test -n "$ZELLIJ" && bun install && tab_name="issue-{{ item.reference_id }}" && tab_id=$(zellij action list-tabs --json | jq -r --arg name "$tab_name" 'first(.[] | select(.name == $name) | .tab_id) // empty') && if [ -n "$tab_id" ]; then zellij action new-pane --tab-id "$tab_id" --cwd "$PWD" --name "implement-{{ item.reference_id }}" -- pi "/implement {{ item.reference_id }}"; else zellij action new-tab --cwd "$PWD" --name "$tab_name" -- pi "/implement {{ item.reference_id }}"; fi'''
cwd = "{{ actions.worktree.inputs.root }}"

[[sources]]
id = "review"

[sources.source]
kind = "github"
mode = "issue"
query = '''repo:__GITHUB_REPOSITORY__ is:open label:"agentboard:ready-for-review" -label:"agentboard:review-in-progress"'''
limit = 12

[sources.source.credentials]
helper = "gh auth token"

[sources.source.status_map]
"agentboard:ready-for-review" = "ready-for-review"
"agentboard:review-complete" = "review-complete"

[[sources.actions]]
id = "worktree"
uses = "agentboard/create-worktree"

[sources.actions.with]
repo = "."
root = "worktrees/issue-{{ item.reference_id }}"
branch = "agentboard/issue-{{ item.reference_id }}"

[[sources.actions]]
uses = "agentboard/run-cmd"

[sources.actions.with]
# ponytail: updated_at rearms this demo after label transitions; production workflows need explicit retry generations.
cmd = ''': "{{ item.raw.github.issue.updated_at }}"; test -n "$ZELLIJ" && bun install && tab_name="issue-{{ item.reference_id }}" && tab_id=$(zellij action list-tabs --json | jq -r --arg name "$tab_name" 'first(.[] | select(.name == $name) | .tab_id) // empty') && if [ -n "$tab_id" ]; then zellij action new-pane --tab-id "$tab_id" --cwd "$PWD" --name "review-{{ item.reference_id }}" -- pi "/review {{ item.reference_id }}"; else zellij action new-tab --cwd "$PWD" --name "$tab_name" -- pi "/review {{ item.reference_id }}"; fi'''
cwd = "{{ actions.worktree.inputs.root }}"

[[sources]]
id = "cleanup"

[sources.source]
kind = "github"
mode = "issue"
query = '''repo:__GITHUB_REPOSITORY__ is:closed label:"agentboard:review-complete" label:"agentboard:cleanup-approved"'''
limit = 12

[sources.source.credentials]
helper = "gh auth token"

[sources.source.status_map]
"agentboard:cleanup-approved" = "cleanup-approved"
"agentboard:review-complete" = "review-complete"

[[sources.actions]]
uses = "agentboard/run-cmd"

[sources.actions.with]
cmd = '''if [ -n "${ZELLIJ:-}" ]; then tab_name="issue-{{ item.reference_id }}"; tab_id=$(zellij action list-tabs --json | jq -r --arg name "$tab_name" 'first(.[] | select(.name == $name) | .tab_id) // empty'); if [ -n "$tab_id" ]; then zellij action close-tab-by-id "$tab_id"; fi; fi; git worktree remove worktrees/issue-{{ item.reference_id }} --force'''
cwd = "."
