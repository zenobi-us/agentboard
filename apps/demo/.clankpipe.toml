[[sources]]
id = "cleanup"

[sources.source]
uses = "@clankpipe/source-github"
mode = "issue"
query = '''repo:__GITHUB_REPOSITORY__ is:closed label:"clankpipe:review-complete" label:"clankpipe:cleanup-approved"'''
limit = 12

[sources.source.credentials]
helper = "gh auth token"

[sources.source.status_map]
"clankpipe:cleanup-approved" = "cleanup-approved"
"clankpipe:review-complete" = "review-complete"

[[sources.actions]]
uses = "@clankpipe/action-run-cmd"

[sources.actions.with]
cmd = '''./launch-agent.sh cleanup "{{ item.reference_id }}"'''
cwd = "."
