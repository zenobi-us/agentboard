[[sources]]
id = "implement"

[sources.source]
uses = "@clankpipe/source-github"
mode = "issue"
query = '''repo:__GITHUB_REPOSITORY__ is:open label:"clankpipe:ready-for-agent" -label:"clankpipe:ready-for-review" -label:"clankpipe:in-progress"'''
limit = 12

[sources.source.credentials]
helper = "gh auth token"

[sources.source.status_map]
"clankpipe:ready-for-agent" = "ready-for-agent"
"clankpipe:changes-requested" = "changes-requested"

[[sources.actions]]
id = "claim"
uses = "@clankpipe/action-run-cmd"

[sources.actions.with]
# ponytail: updated_at rearms this claim after label transitions; production workflows need explicit retry generations.
cmd = ''': "{{ item.raw.github.issue.updated_at }}"; gh issue edit "{{ item.reference_id }}" --repo "__GITHUB_REPOSITORY__" --remove-label "clankpipe:ready-for-agent,clankpipe:changes-requested" --add-label "clankpipe:in-progress"'''
cwd = "."

[[sources.actions]]
id = "worktree"
uses = "@clankpipe/action-worktree"

[sources.actions.with]
repo = "."
root = "worktrees/issue-{{ item.reference_id }}"
branch = "clankpipe/issue-{{ item.reference_id }}"

[[sources.actions]]
uses = "@clankpipe/action-run-cmd"

[sources.actions.with]
# ponytail: updated_at rearms this demo after label transitions; production workflows need explicit retry generations.
cmd = ''': "{{ item.raw.github.issue.updated_at }}"; bun install && ./launch-agent.sh launch implement "{{ item.reference_id }}"'''
cwd = "{{ actions.worktree.inputs.root }}"

[[sources]]
id = "review"

[sources.source]
uses = "@clankpipe/source-github"
mode = "issue"
